[project]
site_name = "College of Information Science · Computing Resources"
site_description = "College of Information Science Computing Resources Working Group: inventory, needs, approaches and recommendations. Point people: Barney Maccabe and Greg Chism."
site_url = "https://gchism94.github.io/talks/education-compute/"
docs_dir = "pages"
site_dir = "_site"
use_directory_urls = false
extra_css = ["guide-assets/guide.css"]
extra_javascript = ["guide-assets/needs.js", "guide-assets/guide.js", "guide-assets/working-needs.js", "guide-assets/luna-drafting.js", "guide-assets/request-submission.js"]
copyright = "College of Information Science · Computing Resources Working Group · Working drafts · Fall 2026–Spring 2027"
nav = [
  { "Overview" = "index.md" },
  { "Resources" = "inventory.md" },
  { "Primers" = "primers.md" },
  { "Resource tool" = "needs.md" },
  { "Report" = "report.md" },
  { "Supplement" = "supplemental.md" },
]

[project.theme]
variant = "classic"
language = "en"
features = ["navigation.tabs", "navigation.tabs.sticky", "navigation.sections", "navigation.top", "search.highlight"]
font = false
[project.theme.palette]
scheme = "default"
primary = "custom"
accent = "custom"
[project.markdown_extensions]
attr_list = {}
md_in_html = {}
admonition = {}
pymdownx.details = {}
toc.permalink = true
[project.plugins.offline]
enabled = true
