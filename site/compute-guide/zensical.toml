[project]
site_name = "Compute Guide"
site_description = "Practical computing resources for research and classrooms: choices, estimates, plans and evidence."
site_url = "https://gchism94.github.io/talks/education-compute/"
docs_dir = "pages"
site_dir = "_site"
use_directory_urls = false
extra_css = ["guide-assets/guide.css"]
extra_javascript = ["guide-assets/needs.js", "guide-assets/guide.js"]
copyright = "Greg Chism · UArizona Information Science · Planning proposal, October 2026"
nav = [
  { "Start here" = [ { "Overview" = "program.md" }, { "Scope your needs" = "needs.md" } ] },
  { "Resources" = [ { "Find a resource" = "resource-library.md" }, { "Classroom platforms" = "classroom-resources.md" }, { "Federal platforms" = "federal-compute.md" }, { "By degree" = "degree-options.md" }, { "Cloud credits & GPUs" = "serverless-compute.md" }, { "Classroom 50" = "classroom50.md" }, { "Repositories & preservation" = "repository-plan.md" } ] },
  { "Plan" = [ { "Stages & milestones" = "timeline.md" }, { "Two-course pilot" = "pilot-plan.md" }, { "Run benchmarks" = "gpu-benchmark.md" }, { "ACCESS request" = "access-request.md" }, { "Time & funding" = "budget.md" }, { "Before class" = "readiness.md" }, { "Route assessment" = "classroom-assessment.md" } ] },
  { "Report" = [ { "Findings & trends" = "report.md" }, { "Full research report" = "research-report.md" }, { "Source evidence" = "evidence.md" }, { "Publishing options" = "publishing.md" }, { "Five-slide talk" = "index.html" } ] },
]
[project.theme]
variant = "classic"
language = "en"
features = ["navigation.tabs", "navigation.sections", "navigation.top", "search.highlight"]
font = false
[project.theme.palette]
scheme = "default"
primary = "custom"
accent = "custom"
[project.markdown_extensions]
attr_list = {}
md_in_html = {}
admonition = {}
pymdownx.details = {}
toc.permalink = true
[project.plugins.offline]
enabled = true
